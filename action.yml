name: Build with coalaura/builder
description: Build Go projects with coalaura/builder

author: coalaura

branding:
  icon: package
  color: blue

inputs:
  version:
    description: Builder version to use
    required: false
    default: latest

  os:
    description: Target operating system
    required: false
    default: linux

  arch:
    description: Target architecture
    required: false
    default: amd64

  cgo:
    description: Enable CGO
    required: false
    default: "false"

  link:
    description: CGO link mode (static or dynamic)
    required: false
    default: static

  optimization:
    description: Build mode (optimize or compatible)
    required: false
    default: optimize

  minify:
    description: Minify and compress the resulting binary
    required: false
    default: "false"

  generate:
    description: Run go generate ./... before building
    required: false
    default: "true"

  gui:
    description: Use the Windows GUI subsystem
    required: false
    default: "false"

  package:
    description: Go package to build
    required: false

  output:
    description: Output file path
    required: false

  target:
    description: Project directory or build target
    required: false

  debug:
    description: Print commands without executing them
    required: false
    default: "false"

  pre:
    description: Shell script used to extend the builder image before building
    required: false

  go-flags:
    description: Additional Go build flags, one argument per line
    required: false

  arguments:
    description: Additional arguments forwarded after --, one argument per line
    required: false

outputs:
  path:
    description: Absolute path to the built binary
    value: ${{ steps.build.outputs.path }}

  filename:
    description: Filename of the built binary
    value: ${{ steps.build.outputs.filename }}

  image:
    description: Builder Docker image used
    value: ${{ steps.build.outputs.image }}

runs:
  using: composite

  steps:
    - name: Resolve Builder
      id: builder
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_OS: ${{ inputs.os }}
        INPUT_ARCH: ${{ inputs.arch }}
        INPUT_CGO: ${{ inputs.cgo }}
        INPUT_LINK: ${{ inputs.link }}
        INPUT_OPTIMIZATION: ${{ inputs.optimization }}
        INPUT_PRE: ${{ inputs.pre }}
      run: |
        set -euo pipefail

        if [[ ! "$INPUT_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
          echo "::error::invalid version: $INPUT_VERSION"
          exit 1
        fi

        version="$INPUT_VERSION"

        if [[ "$INPUT_OS" == "darwin" && "$INPUT_CGO" == "true" ]]; then
          version="${version}-macos"
        fi

        image="coalaura/builder:$version"

        digest="$(
          docker buildx imagetools inspect "$image" \
            --format '{{.Manifest.Digest}}'
        )"

        digest_key="${digest#sha256:}"

        pre_hash="$(
          printf '%s' "$INPUT_PRE" |
            sha256sum |
            cut -c1-16
        )"

        cache_id="$(
          printf '%s\n' \
            "$digest_key" \
            "$INPUT_OS" \
            "$INPUT_ARCH" \
            "$INPUT_CGO" \
            "$INPUT_LINK" \
            "$INPUT_OPTIMIZATION" \
            "$pre_hash" |
            sha256sum |
            cut -c1-20
        )"

        echo "image=${image}@${digest}" >> "$GITHUB_OUTPUT"
        echo "cache-id=$cache_id" >> "$GITHUB_OUTPUT"

    - name: Cache Go modules
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/coalaura-build/go-mod
        key: coalaura-build-mod-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
        restore-keys: |
          coalaura-build-mod-${{ runner.os }}-

    - name: Cache Go build
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/coalaura-build/go-build
        key: coalaura-build-go-${{ runner.os }}-${{ steps.builder.outputs.cache-id }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
        restore-keys: |
          coalaura-build-go-${{ runner.os }}-${{ steps.builder.outputs.cache-id }}-

    - name: Build
      id: build
      shell: bash
      env:
        BUILDER_IMAGE: ${{ steps.builder.outputs.image }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_OS: ${{ inputs.os }}
        INPUT_ARCH: ${{ inputs.arch }}
        INPUT_CGO: ${{ inputs.cgo }}
        INPUT_LINK: ${{ inputs.link }}
        INPUT_OPTIMIZATION: ${{ inputs.optimization }}
        INPUT_MINIFY: ${{ inputs.minify }}
        INPUT_GENERATE: ${{ inputs.generate }}
        INPUT_GUI: ${{ inputs.gui }}
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_DEBUG: ${{ inputs.debug }}
        INPUT_PRE: ${{ inputs.pre }}
        INPUT_GO_FLAGS: ${{ inputs.go-flags }}
        INPUT_ARGUMENTS: ${{ inputs.arguments }}
      run: bash "$GITHUB_ACTION_PATH/entrypoint.sh"
